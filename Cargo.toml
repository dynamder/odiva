[workspace]
members = ["crates/ericed", "crates/odiva-proto", "crates/odiva", "crates/odiva-core"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.88"
publish = false

# Every crate must resolve to the same iced_core/iced_widget: two copies make
# `MouseArea` two types. `ericed` is vendored from ../sofaia, so these versions
# are bumped in both workspaces together — a mismatch surfaces as a
# trait-not-implemented error about `Widget`, several layers from the cause.
[workspace.dependencies]
iced = { version = "0.14.0", features = ["tokio", "markdown"] }
iced_core = "0.14"
iced_widget = "0.14"
# `ericed::motion` needs the frame subscription, which lives above the widgets.
iced_runtime = "0.14"
iced_futures = "0.14"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.20", features = ["compat"] }
# `stdio` is the transport; `process` would only be for its own spawner, and we
# spawn the child ourselves to choose its working directory.
agent-client-protocol = { version = "5.3", features = ["stdio"] }
iced_test = "0.14"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yoagent = "0.27"

ericed = { path = "crates/ericed" }
odiva-proto = { path = "crates/odiva-proto" }
odiva-core = { path = "crates/odiva-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
